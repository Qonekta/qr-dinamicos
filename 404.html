<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi negocio</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .boton {
            display: block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 16px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 17px;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1 id="nombre">Cargando...</h1>

    <p>¿Qué querés hacer?</p>

    <div id="botones"></div>

</div>


<!-- Cargar los clientes -->

<script src="/qr-dinamicos/clientes.js"></script>


<script>

/* =====================================================
   NORMALIZAR ENLACES
===================================================== */

function normalizarEnlace(enlace) {

    let valor =
        String(enlace || "").trim();


    /*
        Si el enlace está vacío,
        no enviamos al usuario a ninguna página.
    */

    if (!valor) {
        return "#";
    }


    /*
        Si ya comienza con http:// o https://,
        lo dejamos como está.
    */

    if (/^https?:\/\//i.test(valor)) {
        return valor;
    }


    /*
        Permitimos enlaces telefónicos
        y enlaces de correo.
    */

    if (
        /^tel:/i.test(valor) ||
        /^mailto:/i.test(valor)
    ) {
        return valor;
    }


    /*
        Si el usuario escribió por ejemplo:

        instagram.com
        www.instagram.com
        wa.me/549260...

        agregamos automáticamente https://
    */

    return "https://" +
        valor.replace(/^\/+/, "");

}



/* =====================================================
   OBTENER CÓDIGO DEL CLIENTE
===================================================== */

// Obtener la dirección actual

const ruta =
    window.location.pathname;


// Separar la dirección en partes

const partes =
    ruta.split("/");


// Buscar el último elemento que tenga contenido

const codigo =
    partes.filter(function(parte) {

        return parte !== "";

    }).pop();



// Buscar el negocio correspondiente

const negocio =
    negocios[codigo];



/* =====================================================
   MOSTRAR INFORMACIÓN DEL NEGOCIO
===================================================== */

if (negocio) {

    document.getElementById("nombre").textContent =
        negocio.nombre;


    const contenedorBotones =
        document.getElementById("botones");


    negocio.botones.forEach(function(boton) {

        const elemento =
            document.createElement("a");


        elemento.className =
            "boton";


        elemento.textContent =
            boton.nombre;


        /*
            Corregimos automáticamente el enlace
            antes de utilizarlo.
        */

        elemento.href =
            normalizarEnlace(
                boton.enlace
            );


        /*
            Abrimos el enlace en una pestaña nueva.
        */

        elemento.target =
            "_blank";


        elemento.rel =
            "noopener noreferrer";


        contenedorBotones.appendChild(
            elemento
        );

    });

}


/* =====================================================
   CÓDIGO NO ENCONTRADO
===================================================== */

else {

    document.getElementById("nombre").textContent =
        "Enlace no encontrado";


    document.querySelector("p").textContent =
        "El código utilizado no está configurado.";

}

</script>

</body>

</html>
