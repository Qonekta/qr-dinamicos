<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi negocio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .fondo-oscuro {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.20);
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            background: rgba(0, 183, 255, 0.28);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .cabecera {
            background: rgba(0, 0, 0, 0.65);
            border-radius: 18px;
            padding: 22px 18px;
            text-align: center;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            color: white;
            font-size: 28px;
            line-height: 1.2;
        }

        .descripcion {
            color: rgba(255, 255, 255, 0.92);
            font-size: 15px;
            line-height: 1.5;
            margin-top: 10px;
            display: none;
        }

        .panel-botones {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            padding: 22px 16px;
        }

        .pregunta {
            color: #555;
            margin-top: 0;
            margin-bottom: 18px;
            text-align: center;
            font-size: 16px;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .boton {
            display: block;
            width: 100%;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            text-align: center;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .boton:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .mensaje-error {
            text-align: center;
            color: #444;
            font-size: 16px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="fondo-oscuro">

    <div class="contenedor">

        <div class="cabecera">

            <h1 id="nombre">
                Cargando...
            </h1>

            <p
                id="descripcion"
                class="descripcion"
            ></p>

        </div>


        <div class="panel-botones">

            <p
                id="pregunta"
                class="pregunta"
            >
                ¿Qué querés hacer?
            </p>

            <div
                id="botones"
                class="botones"
            ></div>

        </div>

    </div>

</div>


<!-- Cargar los clientes -->
<script src="/qr-dinamicos/clientes.js"></script>


<script>

/* =====================================================
   NORMALIZAR ENLACES
===================================================== */

function normalizarEnlace(enlace) {

    let valor =
        String(enlace || "").trim();

    if (!valor) {
        return "";
    }

    if (/^https?:\/\//i.test(valor)) {
        return valor;
    }

    if (
        /^tel:/i.test(valor) ||
        /^mailto:/i.test(valor)
    ) {
        return valor;
    }

    return "https://" +
        valor.replace(/^\/+/, "");

}



/* =====================================================
   OBTENER CÓDIGO DEL CLIENTE
===================================================== */

const ruta =
    window.location.pathname;

const partes =
    ruta.split("/");

const codigo =
    partes.filter(function(parte) {
        return parte !== "";
    }).pop();

const negocio =
    negocios[codigo];


/* =====================================================
   MOSTRAR INFORMACIÓN DEL NEGOCIO
===================================================== */

if (negocio) {

    /* =================================================
       FONDO OPCIONAL
    ================================================= */

    const fondo =
        String(negocio.fondo || "").trim();

    if (fondo) {
        document.body.style.backgroundImage =
            'url("' + fondo + '")';
    }


    /* =================================================
       NOMBRE
    ================================================= */

    document.getElementById("nombre").textContent =
        negocio.nombre;


    /* =================================================
       DESCRIPCIÓN OPCIONAL
    ================================================= */

    const descripcion =
        String(negocio.descripcion || "").trim();

    const elementoDescripcion =
        document.getElementById("descripcion");

    if (descripcion) {
        elementoDescripcion.textContent =
            descripcion;

        elementoDescripcion.style.display =
            "block";
    } else {
        elementoDescripcion.style.display =
            "none";
    }


    /* =================================================
       BOTONES
    ================================================= */

    const contenedorBotones =
        document.getElementById("botones");

    negocio.botones.forEach(function(boton) {

        const enlaceCorregido =
            normalizarEnlace(boton.enlace);

        if (!enlaceCorregido) {
            return;
        }

        const elemento =
            document.createElement("a");

        elemento.className =
            "boton";

        elemento.textContent =
            boton.nombre;

        elemento.href =
            enlaceCorregido;

        elemento.target =
            "_blank";

        elemento.rel =
            "noopener noreferrer";

        contenedorBotones.appendChild(elemento);

    });

}


/* =====================================================
   CÓDIGO NO ENCONTRADO
===================================================== */

else {

    document.getElementById("nombre").textContent =
        "Enlace no encontrado";

    document.getElementById("descripcion").style.display =
        "none";

    document.getElementById("pregunta").textContent =
        "El código utilizado no está configurado.";

    document.getElementById("botones").innerHTML =
        '<p class="mensaje-error">Verificá el código o volvé a intentarlo.</p>';

}

</script>

</body>

</html>
