<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi negocio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .boton {
            display: block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 16px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1 id="nombre">Cargando...</h1>

    <p>¿Qué querés hacer?</p>

    <div id="botones"></div>

</div>

<script>

const negocios = {

    "001": {
        nombre: "Barbería de prueba",

        botones: [
            {
                nombre: "📱 WhatsApp",
                enlace: "https://wa.me/549260XXXXXXXX"
            },
            {
                nombre: "📸 Instagram",
                enlace: "https://www.instagram.com/"
            },
            {
                nombre: "⭐ Dejar una reseña",
                enlace: "https://www.google.com/"
            },
            {
                nombre: "📍 Cómo llegar",
                enlace: "https://www.google.com/maps/"
            }
        ]
    },

    "002": {
        nombre: "Restaurante de prueba",

        botones: [
            {
                nombre: "📱 WhatsApp",
                enlace: "https://wa.me/549260XXXXXXXX"
            },
            {
                nombre: "📸 Instagram",
                enlace: "https://www.instagram.com/"
            },
            {
                nombre: "📖 Ver menú",
                enlace: "https://www.google.com/"
            },
            {
                nombre: "📍 Cómo llegar",
                enlace: "https://www.google.com/maps/"
            }
        ]
    }

};


// Detectar qué código se está utilizando

const partes = window.location.pathname.split("/");

const codigo = partes[partes.length - 1];


// Buscar el negocio

const negocio = negocios[codigo];


// Mostrar la información

if (negocio) {

    document.getElementById("nombre").textContent = negocio.nombre;

    const contenedorBotones = document.getElementById("botones");

    negocio.botones.forEach(function(boton) {

        const elemento = document.createElement("a");

        elemento.className = "boton";

        elemento.textContent = boton.nombre;

        elemento.href = boton.enlace;

        elemento.target = "_blank";

        contenedorBotones.appendChild(elemento);

    });

} else {

    document.getElementById("nombre").textContent = "Enlace no encontrado";

    document.querySelector("p").textContent =
        "El código utilizado no está configurado.";

}

</script>

</body>
</html>
