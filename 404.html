<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi negocio</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .descripcion {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-top: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .pregunta {
            color: #666;
            margin-bottom: 25px;
        }

        .boton {
            display: block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 16px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 17px;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1 id="nombre">
        Cargando...
    </h1>


    <p
        id="descripcion"
        class="descripcion"
    ></p>


    <p
        id="pregunta"
        class="pregunta"
    >
        ¿Qué querés hacer?
    </p>


    <div id="botones"></div>

</div>


<!-- Cargar los clientes -->

<script src="/qr-dinamicos/clientes.js"></script>


<script>

/* =====================================================
   NORMALIZAR ENLACES
===================================================== */

function normalizarEnlace(enlace) {

    let valor =
        String(enlace || "").trim();


    /*
        Si el enlace está vacío,
        devolvemos una cadena vacía.
    */

    if (!valor) {
        return "";
    }


    /*
        Si ya comienza con http:// o https://,
        lo dejamos como está.
    */

    if (/^https?:\/\//i.test(valor)) {
        return valor;
    }


    /*
        Permitimos enlaces telefónicos
        y enlaces de correo.
    */

    if (
        /^tel:/i.test(valor) ||
        /^mailto:/i.test(valor)
    ) {
        return valor;
    }


    /*
        Si el usuario escribió por ejemplo:

        instagram.com
        www.instagram.com
        wa.me/549260...

        agregamos automáticamente https://
    */

    return "https://" +
        valor.replace(/^\/+/, "");

}



/* =====================================================
   OBTENER CÓDIGO DEL CLIENTE
===================================================== */

const ruta =
    window.location.pathname;


const partes =
    ruta.split("/");


const codigo =
    partes.filter(function(parte) {

        return parte !== "";

    }).pop();



const negocio =
    negocios[codigo];



/* =====================================================
   MOSTRAR INFORMACIÓN DEL NEGOCIO
===================================================== */

if (negocio) {


    /* =================================================
       MOSTRAR NOMBRE
    ================================================= */

    document.getElementById(
        "nombre"
    ).textContent =
        negocio.nombre;



    /* =================================================
       MOSTRAR DESCRIPCIÓN SOLO SI EXISTE
    ================================================= */

    const descripcion =
        String(
            negocio.descripcion || ""
        ).trim();


    const elementoDescripcion =
        document.getElementById(
            "descripcion"
        );


    if (descripcion) {

        elementoDescripcion.textContent =
            descripcion;

        elementoDescripcion.style.display =
            "block";

    } else {

        elementoDescripcion.style.display =
            "none";

    }



    /* =================================================
       MOSTRAR BOTONES
    ================================================= */

    const contenedorBotones =
        document.getElementById(
            "botones"
        );


    negocio.botones.forEach(
        function(boton) {


            /*
                Corregimos el enlace.
            */

            const enlaceCorregido =
                normalizarEnlace(
                    boton.enlace
                );


            /*
                Si el enlace está vacío,
                no mostramos ese botón.
            */

            if (!enlaceCorregido) {
                return;
            }


            /*
                Crear botón.
            */

            const elemento =
                document.createElement(
                    "a"
                );


            elemento.className =
                "boton";


            elemento.textContent =
                boton.nombre;


            elemento.href =
                enlaceCorregido;


            elemento.target =
                "_blank";


            elemento.rel =
                "noopener noreferrer";


            contenedorBotones.appendChild(
                elemento
            );

        }
    );

}



/* =====================================================
   CÓDIGO NO ENCONTRADO
===================================================== */

else {

    document.getElementById(
        "nombre"
    ).textContent =
        "Enlace no encontrado";


    document.getElementById(
        "descripcion"
    ).style.display =
        "none";


    document.getElementById(
        "pregunta"
    ).textContent =
        "El código utilizado no está configurado.";

}

</script>

</body>

</html>
